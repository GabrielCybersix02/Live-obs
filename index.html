<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream WebRTC - OBS</title>
    <!-- Biblioteca PeerJS para conexão WebRTC P2P -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover; /* Garante o preenchimento vertical sem distorção */
            background: #000;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        button, select {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            background: #007bff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        select { background: #333; }
        .status { font-size: 14px; color: #ffca28; }
    </style>
</head>
<body>

    <video id="videoElement" autoplay playsinline muted></video>

    <div class="controls" id="controlsPanel">
        <div class="status" id="statusText">A carregar câmara...</div>
        
        <label for="resSelect">Resolução da Transmissão:</label>
        <select id="resSelect">
            <option value="1080x1920" selected>Full HD Vertical (1080x1920)</option>
            <option value="720x1280">HD Vertical (720x1280)</option>
        </select>

        <button id="btnStart">Iniciar Câmera e Transmitir</button>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const statusText = document.getElementById('statusText');
        const resSelect = document.getElementById('resSelect');
        const btnStart = document.getElementById('btnStart');
        const controlsPanel = document.getElementById('controlsPanel');

        // Identificador fixo da sala para o OBS reconectar sempre sem falhas
        const PEER_ID_RECEIVER = "live-obs-stream-gabriel";

        let localStream = null;
        let peer = null;

        // Se estiver dentro do OBS (usando parâmetros de URL)
        const urlParams = new URLSearchParams(window.location.search);
        const isReceiver = urlParams.has('mode') && urlParams.get('mode') === 'obs';

        if (isReceiver) {
            // MODO OBS (RECEPTOR)
            controlsPanel.style.display = 'none';
            initReceiver();
        } else {
            // MODO TELEMÓVEL (TRANSMISSOR)
            btnStart.addEventListener('click', startCamera);
        }

        // Função para obter restrições de resolução
        function getResolutionConstraints() {
            const [w, h] = resSelect.value.split('x').map(Number);
            return {
                video: {
                    width: { ideal: w },
                    height: { ideal: h },
                    facingMode: { ideal: "environment" }, // Câmara traseira
                    frameRate: { max: 30 }
                },
                audio: false
            };
        }

        async function startCamera() {
            try {
                statusText.innerText = "A solicitar permissão da câmara...";
                const constraints = getResolutionConstraints();
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                videoElement.srcObject = localStream;
                statusText.innerText = "Câmara pronta! A conectar ao servidor...";

                initTransmitter();
            } catch (err) {
                statusText.innerText = "Erro ao aceder à câmara: " + err.message;
                console.error(err);
            }
        }

        // Inicializa transmissor (Telemóvel)
        function initTransmitter() {
            peer = new Peer();

            peer.on('open', (id) => {
                statusText.innerText = "Pronto a transmitir! A ligar ao OBS...";
                
                const call = peer.call(PEER_ID_RECEIVER, localStream);
                
                call.on('close', () => {
                    statusText.innerText = "Conexão fechada. Tentando reconectar...";
                });
            });

            peer.on('call', (call) => {
                call.answer(localStream);
            });

            peer.on('error', (err) => {
                statusText.innerText = "Erro Peer: " + err.type;
                console.error(err);
            });
        }

        // Inicializa receptor (OBS Studio)
        function initReceiver() {
            peer = new Peer(PEER_ID_RECEIVER);

            peer.on('open', (id) => {
                console.log("OBS Receptor Ativo. ID:", id);
            });

            peer.on('call', (call) => {
                call.answer();
                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                });
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                }
            });
        }
    </script>
</body>
</html>
