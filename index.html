<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamCam Pro - Zero-Watermark WebRTC Cam for OBS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Cyberpunk Broadcast Theme custom touches */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Hide scrollbars for clean UI */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full w-full font-sans antialiased bg-slate-950 overflow-hidden select-none">

    <!-- OBS RECEIVER / OVERLAY VIEW (Clean video feed) -->
    <div id="obs-view" class="hidden fixed inset-0 w-full h-full bg-black z-50 flex items-center justify-center">
        <video id="remote-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <!-- Disconnected Overlay for OBS -->
        <div id="obs-status" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/90 text-cyan-400 font-mono gap-4 transition-opacity duration-300">
            <div class="relative">
                <div class="w-16 h-16 rounded-full border-4 border-cyan-500/20 border-t-cyan-400 animate-spin"></div>
                <i data-lucide="video" class="w-8 h-8 absolute inset-0 m-auto text-cyan-400"></i>
            </div>
            <div class="text-xl font-bold tracking-widest uppercase">Waiting for Camera Feed...</div>
            <div class="text-xs text-slate-500 font-sans" id="obs-room-display">Room ID: ---</div>
        </div>
    </div>

    <!-- SENDER / MOBILE DASHBOARD VIEW -->
    <div id="sender-view" class="h-full w-full flex flex-col relative overflow-hidden">
        
        <!-- Background Live Preview -->
        <div class="absolute inset-0 z-0 bg-black flex items-center justify-center">
            <video id="local-video" autoplay playsinline muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
            <div id="video-placeholder" class="text-slate-600 flex flex-col items-center gap-2">
                <i data-lucide="camera-off" class="w-12 h-12"></i>
                <span class="text-sm">Camera Offline</span>
            </div>
        </div>

        <!-- Top Header Controls & Metrics -->
        <header class="relative z-10 p-4 flex justify-between items-start gap-2">
            <!-- Connection Status Pill -->
            <div class="glass-panel rounded-full px-4 py-2 flex items-center gap-3 shadow-lg">
                <div id="status-dot" class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></div>
                <span id="status-text" class="text-xs font-bold tracking-wider uppercase text-slate-200">Initializing...</span>
            </div>

            <!-- Realtime Metrics HUD -->
            <div class="glass-panel rounded-2xl p-3 flex gap-4 text-xs font-mono shadow-lg border-emerald-500/20">
                <div class="flex flex-col items-center">
                    <span class="text-slate-400 text-[10px]">FPS</span>
                    <span id="fps-counter" class="font-bold text-emerald-400">00</span>
                </div>
                <div class="w-px bg-slate-700/50"></div>
                <div class="flex flex-col items-center">
                    <span class="text-slate-400 text-[10px]">BITRATE</span>
                    <span id="bitrate-counter" class="font-bold text-cyan-400">0.0 MBPS</span>
                </div>
                <div class="w-px bg-slate-700/50"></div>
                <div class="flex flex-col items-center">
                    <span class="text-slate-400 text-[10px]">LATENCY</span>
                    <span id="ping-counter" class="font-bold text-indigo-400">0 ms</span>
                </div>
            </div>
        </header>

        <!-- Middle Spacer -->
        <div class="flex-1"></div>

        <!-- Bottom Broadcast Dashboard -->
        <footer class="relative z-10 p-4 sm:p-6 flex flex-col gap-4">
            
            <!-- Quick Link / Share Panel -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col gap-3 shadow-2xl">
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-2 text-cyan-400">
                        <i data-lucide="radio" class="w-4 h-4"></i>
                        <span class="text-xs font-bold tracking-wider uppercase">OBS Studio Integration</span>
                    </div>
                    <span id="room-id-badge" class="font-mono text-xs bg-cyan-950/80 text-cyan-300 border border-cyan-800 px-2.5 py-1 rounded-md">ID: ---</span>
                </div>
                
                <div class="flex gap-2">
                    <button id="btn-copy-obs" class="flex-1 bg-cyan-600 hover:bg-cyan-500 active:scale-95 text-slate-950 font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        Copy OBS Browser Link
                    </button>
                    <button id="btn-share" class="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl transition-all">
                        <i data-lucide="share-2" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <!-- Camera & Quality Control Bar -->
            <div class="glass-panel rounded-2xl p-4 flex flex-col gap-4 shadow-2xl">
                <!-- Selectors Grid -->
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <!-- Resolution Selector -->
                    <div class="flex flex-col gap-1">
                        <label class="text-slate-400 font-medium">Resolution</label>
                        <select id="select-res" class="bg-slate-900/90 text-slate-200 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-cyan-500">
                            <option value="1080p" selected>1080p (Full HD)</option>
                            <option value="4k">4K (2160p Ultra HD)</option>
                            <option value="720p">720p (HD)</option>
                        </select>
                    </div>

                    <!-- Framerate Selector -->
                    <div class="flex flex-col gap-1">
                        <label class="text-slate-400 font-medium">Frame Rate</label>
                        <select id="select-fps" class="bg-slate-900/90 text-slate-200 border border-slate-700 rounded-xl p-2.5 focus:outline-none focus:border-cyan-500">
                            <option value="60" selected>60 FPS</option>
                            <option value="30">30 FPS</option>
                        </select>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 pt-1">
                    <button id="btn-toggle-cam" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-slate-950 font-bold py-3.5 px-4 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all shadow-lg shadow-emerald-950/30">
                        <i data-lucide="video" class="w-4 h-4"></i>
                        Start Camera
                    </button>

                    <button id="btn-flip-cam" class="bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 p-3.5 rounded-xl transition-all flex items-center justify-center border border-slate-700">
                        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 glass-panel border border-cyan-500/40 text-cyan-300 px-4 py-2.5 rounded-full text-xs font-semibold shadow-2xl flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none">
        <i data-lucide="check-circle" class="w-4 h-4"></i>
        <span id="toast-msg">Copied to Clipboard!</span>
    </div>

    <script>
        // Application State
        const state = {
            roomId: null,
            peer: null,
            conn: null,
            mediaCall: null,
            localStream: null,
            facingMode: 'user', // 'user' (front) or 'environment' (back)
            resolution: '1080p',
            fps: 60,
            isCameraOn: false,
            isObsMode: false,
            statsInterval: null,
            lastBytesSent: 0,
            lastTimestamp: performance.now(),
            wakeLock: null
        };

        // Resolution Configuration Presets
        const RESOLUTION_PRESETS = {
            '720p': { width: { ideal: 1280 }, height: { ideal: 720 } },
            '1080p': { width: { ideal: 1920 }, height: { ideal: 1080 } },
            '4k': { width: { ideal: 3840 }, height: { ideal: 2160 } }
        };

        // Initialize Icons
        lucide.createIcons();

        // Check Mode (OBS vs Sender)
        function checkMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const isObsHash = window.location.hash.toLowerCase() === '#obs';
            const isObsRole = urlParams.get('role') === 'obs';
            const roomIdParam = urlParams.get('room') || window.location.hash.replace('#obs', '').replace('#', '');

            if (isObsHash || isObsRole || (roomIdParam && isObsRole)) {
                state.isObsMode = true;
                state.roomId = roomIdParam;
                document.getElementById('sender-view').classList.add('hidden');
                document.getElementById('obs-view').classList.remove('hidden');
                initOBSMode();
            } else {
                initSenderMode();
            }
        }

        // ==========================================
        // SENDER MODE LOGIC (Mobile / iPhone Browser)
        // ==========================================
        function initSenderMode() {
            state.roomId = 'streamcam-' + Math.random().toString(36).substring(2, 9);
            document.getElementById('room-id-badge').textContent = `ID: ${state.roomId}`;
            
            // WebRTC RTCConfiguration for low latency
            const peerConfig = {
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            };

            state.peer = new Peer(state.roomId, peerConfig);

            state.peer.on('open', (id) => {
                updateStatus('Ready (Waiting OBS)', 'bg-emerald-500');
            });

            state.peer.on('connection', (dataConn) => {
                state.conn = dataConn;
                updateStatus('OBS Connected', 'bg-cyan-400');
                showToast('OBS Connected Successfully!');
                
                // If stream exists, push immediately
                if (state.localStream) {
                    startCall();
                }
            });

            state.peer.on('error', (err) => {
                console.error('PeerJS Error:', err);
                updateStatus('Connection Error', 'bg-rose-500');
            });

            // Keep Screen Awake on iPhone/Mobile
            requestWakeLock();
            setupSenderEvents();
        }

        async function setupSenderEvents() {
            document.getElementById('btn-toggle-cam').addEventListener('click', toggleCamera);
            document.getElementById('btn-flip-cam').addEventListener('click', flipCamera);
            document.getElementById('select-res').addEventListener('change', (e) => {
                state.resolution = e.target.value;
                if (state.isCameraOn) restartStream();
            });
            document.getElementById('select-fps').addEventListener('change', (e) => {
                state.fps = parseInt(e.target.value);
                if (state.isCameraOn) restartStream();
            });

            document.getElementById('btn-copy-obs').addEventListener('click', () => {
                const obsUrl = `${window.location.origin}${window.location.pathname}?role=obs&room=${state.roomId}`;
                copyToClipboard(obsUrl, 'OBS Link Copied to Clipboard!');
            });

            document.getElementById('btn-share').addEventListener('click', () => {
                const obsUrl = `${window.location.origin}${window.location.pathname}?role=obs&room=${state.roomId}`;
                if (navigator.share) {
                    navigator.share({ title: 'StreamCam OBS Feed', url: obsUrl });
                } else {
                    copyToClipboard(obsUrl, 'OBS Link Copied!');
                }
            });
        }

        async function toggleCamera() {
            if (state.isCameraOn) {
                stopCamera();
            } else {
                await startCamera();
            }
        }

        async function startCamera() {
            try {
                const resConfig = RESOLUTION_PRESETS[state.resolution] || RESOLUTION_PRESETS['1080p'];
                const constraints = {
                    audio: false,
                    video: {
                        facingMode: state.facingMode,
                        width: resConfig.width,
                        height: resConfig.height,
                        frameRate: { ideal: state.fps, max: state.fps }
                    }
                };

                state.localStream = await navigator.mediaDevices.getUserMedia(constraints);
                const localVideo = document.getElementById('local-video');
                localVideo.srcObject = state.localStream;
                document.getElementById('video-placeholder').classList.add('hidden');
                
                // Flip video preview UI for front camera
                if (state.facingMode === 'user') {
                    localVideo.classList.add('scale-x-[-1]');
                } else {
                    localVideo.classList.remove('scale-x-[-1]');
                }

                state.isCameraOn = true;
                const btnToggle = document.getElementById('btn-toggle-cam');
                btnToggle.innerHTML = `<i data-lucide="video-off" class="w-4 h-4"></i> Stop Camera`;
                btnToggle.className = btnToggle.className.replace('bg-emerald-600', 'bg-rose-600').replace('hover:bg-emerald-500', 'hover:bg-rose-500');
                lucide.createIcons();

                if (state.conn) {
                    startCall();
                }

                startMetricsTracking();
            } catch (err) {
                console.error("Camera access error:", err);
                showToast("Camera Error: " + err.message);
            }
        }

        function stopCamera() {
            if (state.localStream) {
                state.localStream.getTracks().forEach(track => track.stop());
                state.localStream = null;
            }
            document.getElementById('local-video').srcObject = null;
            document.getElementById('video-placeholder').classList.remove('hidden');
            
            state.isCameraOn = false;
            const btnToggle = document.getElementById('btn-toggle-cam');
            btnToggle.innerHTML = `<i data-lucide="video" class="w-4 h-4"></i> Start Camera`;
            btnToggle.className = btnToggle.className.replace('bg-rose-600', 'bg-emerald-600').replace('hover:bg-rose-500', 'hover:bg-emerald-500');
            lucide.createIcons();

            if (state.mediaCall) {
                state.mediaCall.close();
            }
            stopMetricsTracking();
        }

        async function restartStream() {
            if (state.isCameraOn) {
                stopCamera();
                await startCamera();
            }
        }

        async function flipCamera() {
            state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
            await restartStream();
        }

        function startCall() {
            if (!state.localStream || !state.roomId) return;
            
            // Connect and optimize SDP for max bandwidth
            state.mediaCall = state.peer.call(state.roomId + '-obs', state.localStream, {
                sdpTransform: (sdp) => setHighBandwidthSDP(sdp)
            });
        }

        // SDP Modification for Uncompressed / High-Bitrate WebRTC
        function setHighBandwidthSDP(sdp) {
            let lines = sdp.split('\r\n');
            lines = lines.map(line => {
                if (line.startsWith('a=fmtp:')) {
                    // Set max video bitrate hint
                    return line + ';x-google-max-bitrate=12000;x-google-min-bitrate=4000;x-google-start-bitrate=8000';
                }
                return line;
            });
            return lines.join('\r\n');
        }

        // Metrics Tracking (FPS, Bitrate, Latency)
        function startMetricsTracking() {
            stopMetricsTracking();
            state.lastTimestamp = performance.now();
            state.lastBytesSent = 0;

            state.statsInterval = setInterval(async () => {
                if (!state.mediaCall || !state.mediaCall.peerConnection) return;

                const pc = state.mediaCall.peerConnection;
                const stats = await pc.getStats();
                
                stats.forEach(report => {
                    if (report.type === 'outbound-rtp' && report.kind === 'video') {
                        const now = performance.now();
                        const dt = (now - state.lastTimestamp) / 1000;
                        const bytes = report.bytesSent - state.lastBytesSent;
                        
                        if (dt > 0) {
                            const bitrateMbps = ((bytes * 8) / (dt * 1000000)).toFixed(1);
                            const fps = report.framesPerSecond || state.fps;

                            document.getElementById('bitrate-counter').textContent = `${bitrateMbps} MBPS`;
                            document.getElementById('fps-counter').textContent = `${fps}`;
                        }

                        state.lastBytesSent = report.bytesSent;
                        state.lastTimestamp = now;
                    }

                    if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                        const ping = report.currentRoundTripTime ? Math.round(report.currentRoundTripTime * 1000) : 15;
                        document.getElementById('ping-counter').textContent = `${ping} ms`;
                    }
                });
            }, 1000);
        }

        function stopMetricsTracking() {
            if (state.statsInterval) clearInterval(state.statsInterval);
            document.getElementById('bitrate-counter').textContent = '0.0 MBPS';
            document.getElementById('fps-counter').textContent = '00';
            document.getElementById('ping-counter').textContent = '0 ms';
        }

        // ==========================================
        // OBS OVERLAY MODE LOGIC (Full Bleed Video)
        // ==========================================
        function initOBSMode() {
            const obsPeerId = state.roomId + '-obs';
            document.getElementById('obs-room-display').textContent = `ROOM: ${state.roomId}`;

            state.peer = new Peer(obsPeerId, {
                config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            state.peer.on('open', () => {
                // Signal readiness to sender peer
                const conn = state.peer.connect(state.roomId);
            });

            state.peer.on('call', (call) => {
                call.answer(); // Answer incoming stream
                call.on('stream', (remoteStream) => {
                    const videoEl = document.getElementById('remote-video');
                    videoEl.srcObject = remoteStream;
                    document.getElementById('obs-status').classList.add('opacity-0', 'pointer-events-none');
                });
            });

            state.peer.on('error', (err) => {
                console.error("OBS Peer Error:", err);
            });
        }

        // ==========================================
        // UTILITIES
        // ==========================================
        function updateStatus(text, bgClass) {
            document.getElementById('status-text').textContent = text;
            const dot = document.getElementById('status-dot');
            dot.className = `w-3 h-3 rounded-full ${bgClass}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function copyToClipboard(text, successMsg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(successMsg);
            }).catch(() => {
                // Fallback
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast(successMsg);
            });
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    state.wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log('Wake lock failed:', err);
            }
        }

        // Run setup on load
        window.addEventListener('DOMContentLoaded', checkMode);
    </script>
</body>
</html>
